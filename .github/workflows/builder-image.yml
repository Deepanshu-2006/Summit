name: builder-image

# Builds and publishes the Summit builder image (builder/deployments/worker.Dockerfile) to GHCR.
# Package: ghcr.io/<repository owner, lowercased>/summit-builder  (private by default; keep it
# that way and give the build cluster a read-only pull secret, see docs/ghcr_mvp_setup.md).

on:
  push:
    branches: [main]
    paths:
      - "builder/**"
      - ".github/workflows/builder-image.yml"
  workflow_dispatch:

concurrency:
  group: builder-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: builder/go.sum
      - name: go vet
        working-directory: builder
        run: go vet ./...
      - name: go test
        working-directory: builder
        run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${owner}/summit-builder" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: builder
          file: builder/deployments/worker.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Builder image published"
            echo
            echo "- Digest: \`${DIGEST}\`"
            echo "- Tags: \`sha-${GITHUB_SHA}\`, \`latest\`"
            echo "- Deploy by digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
