# One-shot migration Job. deploy/local/migrate.sh deletes and recreates it.
# Uses /migrate from the summit-api image. summit-system is PSA restricted.
apiVersion: batch/v1
kind: Job
metadata:
  name: summit-migrate
  namespace: summit-system
  labels:
    app.kubernetes.io/name: summit-migrate
    app.kubernetes.io/part-of: summit
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summit-migrate
        app.kubernetes.io/part-of: summit
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: summit-api:dev
          imagePullPolicy: IfNotPresent
          command: ["/migrate", "up"]
          env:
            - name: ENVIRONMENT
              value: development
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          envFrom:
            - secretRef:
                name: summit-api-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
