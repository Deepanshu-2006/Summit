# Example local cluster for Summit. Create with:
#   kind create cluster --name summit-local --config apps/backend/config/kind/kind-config.yaml
# Do not run against an existing cluster you want to keep: it is creation input only.
#
# - 80/443/4000 on the node are published to the host:
#     30080 -> 80    Traefik web
#     30443 -> 443   Traefik websecure
#     30400 -> 4000  summit-api (GitHub App callback is registered at
#                    http://127.0.0.1:4000)
#   localtest.me resolves to loopback, so
#   http://<service>-<project>.localtest.me reaches Traefik.
#   A cluster created without these mappings (kind-summit-local today) must use
#   deploy/local/ports.sh. Do not recreate that cluster to pick this file up.
# - kindnet in recent Kind releases enforces networking.k8s.io/v1 NetworkPolicy, so
#   ORCHESTRATOR_NETWORK_POLICY_MODE=native works without installing Cilium. To use
#   Cilium instead, set disableDefaultCNI: true and install Cilium before workloads.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: false
  serviceSubnet: "10.96.0.0/16"   # keep in sync with ORCHESTRATOR_SERVICE_CIDR
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080   # Traefik web NodePort
        hostPort: 80
        protocol: TCP
      - containerPort: 30443   # Traefik websecure NodePort
        hostPort: 443
        protocol: TCP
      - containerPort: 30400   # summit-api NodePort
        hostPort: 4000
        protocol: TCP
