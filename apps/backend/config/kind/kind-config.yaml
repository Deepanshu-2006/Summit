# Example local cluster for Summit. Create with:
#   kind create cluster --name summit-local --config apps/backend/config/kind/kind-config.yaml
# Do not run against an existing cluster you want to keep: it is creation input only.
#
# - 80/443 on the node are published to the host so a Traefik Service of type
#   NodePort (30080/30443) or hostPort install is reachable at
#   http://<service>-<project>.localtest.me (localtest.me resolves to 127.0.0.1).
# - kindnet in recent Kind releases enforces networking.k8s.io/v1 NetworkPolicy, so
#   ORCHESTRATOR_NETWORK_POLICY_MODE=native works without installing Cilium. To use
#   Cilium instead, set disableDefaultCNI: true and install Cilium before workloads.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: false
  serviceSubnet: "10.96.0.0/16"   # keep in sync with ORCHESTRATOR_SERVICE_CIDR
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080   # Traefik web NodePort
        hostPort: 80
        protocol: TCP
      - containerPort: 30443   # Traefik websecure NodePort
        hostPort: 443
        protocol: TCP
