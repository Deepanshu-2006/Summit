# Summit orchestrator. A single replica: the pruner has no leader election yet
# (contract C7) so two replicas would run duplicate sweeps. The process serves no
# HTTP port today, so there are no probes.
#
# Image: apps/backend/Dockerfile.orchestrator, loaded with
# `kind load docker-image summit-orchestrator:dev --name summit-local`.
#
# Secret summit-orchestrator-env (deploy/local/secrets.sh): DATABASE_URL and
# WORKER_JWT_SECRET (>= 32 bytes). WORKER_JWT_SECRET matches summit-api-env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summit-orchestrator
  namespace: summit-system
  labels:
    app.kubernetes.io/name: summit-orchestrator
    app.kubernetes.io/part-of: summit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: summit-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summit-orchestrator
        app.kubernetes.io/part-of: summit
    spec:
      serviceAccountName: summit-orchestrator
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: summit-orchestrator:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ORCHESTRATOR_ENV
              value: development
            - name: ORCHESTRATOR_LOG_LEVEL
              value: info
            - name: ORCHESTRATOR_CLUSTER_TARGET
              value: in-cluster
            # Build Pods call this in-cluster address. They must not use
            # 127.0.0.1:4000 (that is the host forwarder for browsers).
            - name: ORCHESTRATOR_API_INTERNAL_URL
              value: http://summit-api.summit-system.svc.cluster.local:4000
            - name: SUMMIT_BUILD_NAMESPACE
              value: summit-builds
            - name: SUMMIT_BUILDER_IMAGE
              value: summit-builder:dev
            - name: SUMMIT_BUILDER_RUNTIME_CLASS
              value: gvisor
            - name: ORCHESTRATOR_GHCR_PUSH_SECRET
              value: ghcr-push
            # Optional add-ons (contract C8). Quotas and ingress are on.
            # Network policy and ESO stay off until those controllers are installed.
            - name: ORCHESTRATOR_ENABLE_TENANT_QUOTAS
              value: "true"
            - name: ORCHESTRATOR_ENABLE_NETWORK_POLICY
              value: "false"
            - name: ORCHESTRATOR_NETWORK_POLICY_MODE
              value: native
            - name: ORCHESTRATOR_ENABLE_INGRESS
              value: "true"
            # Read by the orchestrator once the Go change lands. Ignored until then.
            - name: ORCHESTRATOR_PUBLIC_URL_SCHEME
              value: http
            - name: ORCHESTRATOR_ENABLE_ESO
              value: "false"
            - name: ORCHESTRATOR_APPS_DOMAIN
              value: localtest.me
            - name: ORCHESTRATOR_API_NAMESPACE
              value: summit-system
            - name: ORCHESTRATOR_API_PORT
              value: "4000"
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: summit-orchestrator-env
                  key: DATABASE_URL
            - name: WORKER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: summit-orchestrator-env
                  key: WORKER_JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
