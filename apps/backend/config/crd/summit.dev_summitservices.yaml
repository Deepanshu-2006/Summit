apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: summitservices.summit.dev
  labels:
    app.kubernetes.io/name: summit
    app.kubernetes.io/part-of: summit
    app.kubernetes.io/managed-by: summit-orchestrator
spec:
  group: summit.dev
  names:
    kind: SummitService
    listKind: SummitServiceList
    plural: summitservices
    singular: summitservice
    shortNames:
      - ssvc
      - summit
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: SummitService represents a backend service workload desired state in the Summit PaaS.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: SummitServiceSpec defines the desired execution specification for a backend workload.
              required:
                - image
              properties:
                image:
                  type: string
                  description: Immutable OCI image reference pinned by SHA-256 digest (e.g. ghcr.io/org/app@sha256:abc...).
                  pattern: '^.+@sha256:[a-fA-F0-9]{64}$'
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 1
                  description: Number of desired pod replicas.
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  default: 8080
                  description: Internal listening container port and ClusterIP target port.
                pullSecretName:
                  type: string
                  description: Configurable GHCR image pull secret name in the target namespace. Defaults to ghcr-pull.
                tenantId:
                  type: string
                  description: Unique tenant identifier for tenancy labeling and isolation.
                projectId:
                  type: string
                  description: Unique project identifier.
                serviceId:
                  type: string
                  description: Unique service identifier.
                releaseId:
                  type: string
                  description: Unique release identifier.
                resources:
                  type: object
                  description: Compute resource bounds (CPU, memory, ephemeral-storage requests and limits).
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        type: string
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                env:
                  type: array
                  description: Optional environment variables injected into the service container.
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      value:
                        type: string
            status:
              type: object
              description: SummitServiceStatus reflects the observed reconciliation state of the workload.
              properties:
                phase:
                  type: string
                  description: High-level reconciliation phase (Pending, Progressing, Available, Failed).
                observedGeneration:
                  type: integer
                  format: int64
                readyReplicas:
                  type: integer
                  format: int32
                deploymentName:
                  type: string
                serviceName:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
