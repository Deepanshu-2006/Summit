apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: summitservices.summit.dev
  labels:
    app.kubernetes.io/name: summit
    app.kubernetes.io/part-of: summit
    app.kubernetes.io/managed-by: summit-orchestrator
spec:
  group: summit.dev
  names:
    kind: SummitService
    listKind: SummitServiceList
    plural: summitservices
    singular: summitservice
    shortNames:
      - ssvc
      - summit
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: SummitService represents a backend service or database workload desired state in the Summit PaaS.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: SummitServiceSpec defines the desired execution specification for a backend or database workload.
              x-kubernetes-validations:
                - rule: "!has(self.type) || self.type != 'postgres' || (has(self.postgres) && (!has(self.replicas) || self.replicas == 1) && (!has(self.port) || self.port == 5432) && (!has(self.env) || size(self.env) == 0))"
                  message: "postgres workloads require postgres settings, exactly one replica, port 5432, and no custom env variables"
                - rule: "!has(self.type) || self.type != 'backend' || !has(self.postgres)"
                  message: "postgres settings are only valid when type is postgres"
              properties:
                type:
                  type: string
                  description: Architectural workload type ('backend' for stateless service, 'postgres' for database).
                  enum:
                    - backend
                    - postgres
                  default: backend
                postgres:
                  type: object
                  description: Dedicated PostgreSQL database specification.
                  required:
                    - storage
                    - auth
                  properties:
                    version:
                      type: string
                      description: Deliberate major PostgreSQL version (must be '16' for MVP).
                      enum:
                        - "16"
                      default: "16"
                    image:
                      type: string
                      description: Immutable OCI image reference pinned by SHA-256 digest.
                      pattern: '^.+@sha256:[a-fA-F0-9]{64}$'
                    databaseName:
                      type: string
                      pattern: '^[a-z_][a-z0-9_]{0,62}$'
                      description: Default PostgreSQL database name (defaults to 'summit').
                      default: summit
                    username:
                      type: string
                      pattern: '^[a-z_][a-z0-9_]{0,62}$'
                      description: Default PostgreSQL administrative username (defaults to 'postgres').
                      default: postgres
                    storage:
                      type: object
                      description: Explicit storage configuration. Cluster default StorageClass is strictly prohibited.
                      required:
                        - storageClassName
                        - size
                      properties:
                        storageClassName:
                          type: string
                          minLength: 1
                          description: Explicit CSI StorageClass name (e.g. gp3, fast-csi).
                        size:
                          type: string
                          minLength: 1
                          pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)$'
                          description: Volume capacity request (e.g. 10Gi, 50Gi).
                    auth:
                      type: object
                      description: Authentication secret reference. Plaintext credentials are strictly forbidden.
                      required:
                        - secretRef
                      properties:
                        secretRef:
                          type: object
                          required:
                            - name
                            - key
                          properties:
                            name:
                              type: string
                              minLength: 1
                              description: Kubernetes Secret name in the same namespace.
                            key:
                              type: string
                              minLength: 1
                              description: Secret data key containing the database password.
                image:
                  type: string
                  description: Immutable OCI image reference pinned by SHA-256 digest (e.g. ghcr.io/org/app@sha256:abc...).
                  pattern: '^.+@sha256:[a-fA-F0-9]{64}$'
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 1
                  description: Number of desired pod replicas (must be 1 for postgres).
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  description: Internal listening container port and ClusterIP target port (defaults to 8080 for backend, 5432 for postgres).
                pullSecretName:
                  type: string
                  description: Configurable GHCR image pull secret name in the target namespace. Defaults to ghcr-pull.
                tenantId:
                  type: string
                  description: Unique tenant identifier for tenancy labeling and isolation.
                projectId:
                  type: string
                  description: Unique project identifier.
                serviceId:
                  type: string
                  description: Unique service identifier.
                releaseId:
                  type: string
                  description: Unique release identifier.
                resources:
                  type: object
                  description: Compute resource bounds (CPU, memory, ephemeral-storage requests and limits).
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        type: string
                    requests:
                      type: object
                      additionalProperties:
                        type: string
                env:
                  type: array
                  description: Optional environment variables injected into the service container.
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      value:
                        type: string
            status:
              type: object
              description: SummitServiceStatus reflects the observed reconciliation state of the workload.
              properties:
                phase:
                  type: string
                  description: High-level reconciliation phase (Pending, Progressing, Available, Failed).
                observedGeneration:
                  type: integer
                  format: int64
                readyReplicas:
                  type: integer
                  format: int32
                deploymentName:
                  type: string
                statefulSetName:
                  type: string
                serviceName:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
