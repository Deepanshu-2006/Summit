# Summit control-plane API. PORT defaults to 4000 (internal/config/config.go), so the
# in-cluster URL builders use is http://summit-api.summit-system.svc.cluster.local:4000.
# The Service port equals the container port to keep that URL short and the build
# network policy (ORCHESTRATOR_API_PORT) aligned with the pod port.
#
# The image is a placeholder: no backend Dockerfile exists in the repo yet. For Kind:
# `kind load docker-image summit-api:dev`.
#
# Create Secret summit-api-env by hand (see config/README.md); every key becomes an
# environment variable (DATABASE_URL, WORKER_JWT_SECRET, SUPABASE_*, GITHUB_* ...).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summit-api
  namespace: summit-system
  labels:
    app.kubernetes.io/name: summit-api
    app.kubernetes.io/part-of: summit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: summit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summit-api
        app.kubernetes.io/part-of: summit
    spec:
      # The API never talks to Kubernetes (contract C6).
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: summit-api:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
            - name: ENVIRONMENT
              value: development
          envFrom:
            - secretRef:
                name: summit-api-env
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: summit-api
  namespace: summit-system
  labels:
    app.kubernetes.io/name: summit-api
    app.kubernetes.io/part-of: summit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: summit-api
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
