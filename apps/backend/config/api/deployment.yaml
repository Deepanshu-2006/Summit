# Summit control-plane API. PORT defaults to 4000 (internal/config/config.go).
# Builders call http://summit-api.summit-system.svc.cluster.local:4000
# (ORCHESTRATOR_API_INTERNAL_URL). Browsers and the GitHub App callback use
# http://127.0.0.1:4000, which is this Service's NodePort 30400 published by
# deploy/local/ports.sh (or by kind extraPortMappings on a fresh cluster).
# A NodePort Service still has a cluster IP, so the DNS name above keeps working.
#
# Image: apps/backend/Dockerfile.api, loaded with
# `kind load docker-image summit-api:dev --name summit-local`.
#
# Secret summit-api-env is created by deploy/local/secrets.sh (never commit it).
# envFrom supplies DATABASE_URL, SUPABASE_URL / NEXT_PUBLIC_SUPABASE_URL (JWKS
# is derived in config.Load), GitHub App id/slug/private key, and WORKER_JWT_SECRET.
# Explicit env below wins over the secret for the public URLs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summit-api
  namespace: summit-system
  labels:
    app.kubernetes.io/name: summit-api
    app.kubernetes.io/part-of: summit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: summit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summit-api
        app.kubernetes.io/part-of: summit
    spec:
      # The API never talks to Kubernetes (contract C6).
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: summit-api:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
            - name: ENVIRONMENT
              value: development
            - name: PLATFORM_FRONTEND_BASE_URL
              value: http://localhost:3000
            - name: PLATFORM_PUBLIC_API_BASE_URL
              value: http://127.0.0.1:4000
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          envFrom:
            - secretRef:
                name: summit-api-env
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: summit-api
  namespace: summit-system
  labels:
    app.kubernetes.io/name: summit-api
    app.kubernetes.io/part-of: summit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: summit-api
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: 30400
      protocol: TCP
