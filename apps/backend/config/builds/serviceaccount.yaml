# ServiceAccount referenced by build Pods (build.DefaultServiceAccountName). Pods
# set automountServiceAccountToken=false, and this account has no RBAC bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: summit-builder
  namespace: summit-builds
  labels:
    app.kubernetes.io/part-of: summit
    summit.dev/managed-by: summit-orchestrator
automountServiceAccountToken: false
