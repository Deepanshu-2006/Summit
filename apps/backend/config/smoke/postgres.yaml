apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: summit-smoke
  labels:
    app.kubernetes.io/name: summit-smoke-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: summit-smoke
  labels:
    app: postgres
    app.kubernetes.io/name: summit-smoke-postgres
spec:
  replicas: 1
  # A single PostgreSQL pod owns this ReadWriteOnce claim. Avoid overlapping
  # old and new pods during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: summit-smoke-postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: summit
            - name: POSTGRES_USER
              value: summit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: summit-smoke-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U summit -d summit
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: summit-smoke
  labels:
    app.kubernetes.io/name: summit-smoke-postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
