# Platform namespaces. Tenant namespaces (tenant-<user_id>) are created and
# hardened at runtime by the orchestrator (internal/cluster/addons).
#
# Pod Security Admission levels
# - summit-system: restricted. The API and orchestrator Deployments in this
#   directory are non-root, drop ALL capabilities, use RuntimeDefault seccomp and
#   forbid privilege escalation.
# - summit-builds: privileged admission is required for rootless BuildKit's
#   newuidmap/newgidmap helpers: the builder pod uses allowPrivilegeEscalation=true
#   and adds only SETUID/SETGID after dropping all other capabilities. This PSA
#   label does not make containers privileged. Keep audit/warn at restricted, keep
#   the builder on gVisor with its explicit non-root/seccomp/capability settings,
#   and grant pod creation in this namespace only to the orchestrator service
#   account. Revisit with a narrow PSA exemption or equivalent policy if the
#   cluster supports one that admits these exact fields.
apiVersion: v1
kind: Namespace
metadata:
  name: summit-system
  labels:
    app.kubernetes.io/part-of: summit
    app.kubernetes.io/managed-by: summit-orchestrator
    summit.dev/managed-by: summit-orchestrator
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: summit-builds
  labels:
    app.kubernetes.io/part-of: summit
    app.kubernetes.io/managed-by: summit-orchestrator
    summit.dev/managed-by: summit-orchestrator
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
