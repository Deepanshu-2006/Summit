# Platform namespaces. Tenant namespaces (tenant-<user_id>) are created and
# hardened at runtime by the orchestrator (internal/cluster/addons).
#
# Pod Security Admission levels
# - summit-system: restricted. The API and orchestrator Deployments in this
#   directory are non-root, drop ALL capabilities, use RuntimeDefault seccomp and
#   forbid privilege escalation.
# - summit-builds: restricted. internal/orchestrator/build/pod.go builds Pods with
#   runAsNonRoot (uid 1000), allowPrivilegeEscalation=false, capabilities drop
#   ALL, seccompProfile RuntimeDefault, and only configMap/secret/emptyDir volumes
#   (no hostPath, no hostNetwork, no privileged). That satisfies the restricted
#   profile, so no weaker level is needed. The gVisor runtimeClassName is not
#   inspected by PSA.
#   CAVEAT: if the builder image later needs seccomp/AppArmor "Unconfined" for
#   rootless BuildKit, neither baseline nor restricted admits it (both forbid
#   Unconfined seccomp); the namespace would have to move to "privileged" or use a
#   PSA exemption. Keep builds on RuntimeDefault while the builder works under it.
apiVersion: v1
kind: Namespace
metadata:
  name: summit-system
  labels:
    app.kubernetes.io/part-of: summit
    app.kubernetes.io/managed-by: summit-orchestrator
    summit.dev/managed-by: summit-orchestrator
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: summit-builds
  labels:
    app.kubernetes.io/part-of: summit
    app.kubernetes.io/managed-by: summit-orchestrator
    summit.dev/managed-by: summit-orchestrator
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
