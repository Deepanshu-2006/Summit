openapi: 3.1.0
info:
  title: Summit Jetway PaaS Control Plane API
  version: 1.1.0
  description: >-
    OpenAPI 3.1 contract for the Summit Jetway developer platform, matching what the Go
    backend (apps/backend) serves. Paths are the Go paths: the Next.js dashboard reaches
    them through its server-side proxy, which forwards `/api/platform/v1/*` to `/v1/*`
    with the caller's Supabase access token as a Bearer token.


    All `/v1` routes require `Authorization: Bearer <Supabase access token>` and are
    tenant-scoped to the authenticated user. A resource owned by another user is
    indistinguishable from a missing one and yields `404`.


    JSON fields are snake_case, timestamps are RFC 3339 (UTC), and nullable fields are
    serialised as JSON `null`. Errors use the envelope described by `ErrorEnvelope`.
servers:
  - url: http://localhost:4000
    description: Local Backend Service
  - url: https://api.jetway.internal
    description: Internal Kubernetes Control Plane

tags:
  - name: System
    description: Service heartbeat
  - name: Authentication
    description: Authenticated user profile synchronization
  - name: Projects
    description: Projects, their environments and services
  - name: Services
    description: Deployable services and manual deploys
  - name: GitHub
    description: GitHub App installations, repositories, and service source configuration
  - name: Deployments
    description: Deployment history, status, cancellation and build logs

paths:
  /v1/auth/profile:
    post:
      tags:
        - Authentication
      summary: Sync authenticated user profile
      description: Validates a Supabase access token and upserts the matching public.users profile.
      operationId: syncAuthenticatedUserProfile
      security:
        - SupabaseBearerAuth: []
      responses:
        "204":
          description: The authenticated user's profile was created or updated.
        "401":
          description: The access token is missing or invalid.
        "500":
          description: The profile could not be persisted.
        "503":
          description: Authentication or profile storage is unavailable.

  /api/v1/health:
    get:
      tags:
        - System
      summary: System Health & Heartbeat
      description: Returns service health, uptime, and edge routing region. Also served at `/health`.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy and routing traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags: [System]
      summary: Health probe headers
      operationId: headHealth
      security: []
      responses:
        "200":
          description: The service is healthy; response body is omitted for HEAD.

  /health:
    get:
      tags: [System]
      summary: Health probe alias
      operationId: getHealthAlias
      security: []
      responses:
        "200":
          description: Service health, uptime, and edge routing region.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      tags: [System]
      summary: Health probe alias headers
      operationId: headHealthAlias
      security: []
      responses:
        "200":
          description: The service is healthy; response body is omitted for HEAD.

  /v1/projects:
    get:
      tags:
        - Projects
      summary: List projects
      description: The caller's projects, newest first, with service counts and the latest deployment.
      operationId: listProjects
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Projects
      summary: Create a project
      description: >-
        Creates a project together with its `production` environment. When `slug` is omitted it is
        derived from `name` (lowercase, runs of non `[a-z0-9]` become `-`, trimmed, at most 63
        characters, `project` if empty); a collision on a derived slug is retried as `-2`, `-3`, ...
        (bounded), whereas a collision on an explicit `slug` returns `409`.
      operationId: createProject
      security:
        - SupabaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Projects
      summary: Get a project
      description: Project with its environments and services (each with source and latest deployment).
      operationId: getProject
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Projects
      summary: Update a project
      operationId: updateProject
      security:
        - SupabaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: Soft-deletes the project and its environments and services. The slug stays reserved.
      operationId: deleteProject
      security:
        - SupabaseBearerAuth: []
      responses:
        "204":
          description: Project deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/services:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags:
        - Projects
        - Services
      summary: Create a service
      description: >-
        Creates a `web` or `worker` service in the project's production environment, or in
        `environment_id` if given (it must belong to this project, otherwise `404`). The service name must
        be 1-63 chars of `a-z`, `0-9`, `-`, not starting or ending with `-`, and unique per environment.
      operationId: createProjectService
      security:
        - SupabaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/projects/{project_id}/environments:
    post:
      tags: [Projects]
      summary: Create a project environment
      operationId: createProjectEnvironment
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/projects/{project_id}/deployments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Deployments
      summary: List a project's deployments
      description: Newest first, keyset-paginated.
      operationId: listProjectDeployments
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of deployments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/deployments/{deployment_id}:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags:
        - Deployments
      summary: Get a deployment
      description: Deployment with its build job and status transition history (oldest first).
      operationId: getDeployment
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Deployment detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/deployments/{deployment_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    post:
      tags:
        - Deployments
      summary: Request cancellation of a deployment
      description: >-
        Records a cancel request on an in-flight deployment (queued, building, image_ready, deploying,
        health_checking). The orchestrator performs the actual transition asynchronously, so the returned
        `status` may still be the in-flight one while `cancel_requested_at` is set. Repeating the call is
        idempotent. Running or terminal deployments yield `409`.
      operationId: cancelDeployment
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Cancel request recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/deployments/{deployment_id}/logs:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags:
        - Deployments
      summary: Read build logs
      description: >-
        Build log lines with `id > after`, in insertion order. To tail, pass the previous response's
        `next_after` as `after`; `next_after` is the id of the last returned line and `null` when the page
        is empty. `limit` defaults to 500 and is capped at 1000.
      operationId: listDeploymentLogs
      security:
        - SupabaseBearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          description: Return only lines with an id greater than this value (default 0).
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000
      responses:
        "200":
          description: Log lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services:
    get:
      tags:
        - Services
      summary: List deployable services
      description: The caller's web and worker services across all projects, for source selection.
      operationId: listServices
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlatServiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/github/installations:
    get:
      tags: [GitHub]
      summary: List GitHub App installations
      operationId: listGitHubInstallations
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Installations owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [GitHub]
      summary: Start GitHub App installation
      operationId: startGitHubInstallation
      security:
        - SupabaseBearerAuth: []
      responses:
        "201":
          description: GitHub installation URL and short-lived state expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationStart"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/integrations/github/callback:
    get:
      tags: [GitHub]
      summary: Complete GitHub App installation callback
      description: Browser redirect callback. State is validated by the backend; this route does not use bearer authentication.
      operationId: completeGitHubInstallation
      security: []
      parameters:
        - name: installation_id
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: setup_action
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirects the browser to the configured dashboard result URL.

  /v1/github/installations/{installation_id}:
    parameters:
      - $ref: "#/components/parameters/GitHubInstallationId"
    get:
      tags: [GitHub]
      summary: Get a GitHub App installation
      operationId: getGitHubInstallation
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Installation details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [GitHub]
      summary: Disconnect a GitHub App installation
      operationId: disconnectGitHubInstallation
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Installation disconnect status.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/github/installations/{installation_id}/repositories:
    get:
      tags: [GitHub]
      summary: List repositories for an installation
      operationId: listGitHubInstallationRepositories
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GitHubInstallationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of synchronized repositories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/github/installations/{installation_id}/sync:
    post:
      tags: [GitHub]
      summary: Synchronize installation repositories
      operationId: syncGitHubInstallation
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GitHubInstallationId"
      responses:
        "200":
          description: Repository synchronization result.
          content:
            application/json:
              schema:
                type: object
                required: [sync_id, status, repositories_synced]
                properties:
                  sync_id: { type: string, format: uuid }
                  status: { type: string }
                  repositories_synced: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services/{service_id}:
    delete:
      tags: [Services]
      summary: Delete a service
      description: Soft-deletes the caller-owned service and queues runtime cleanup.
      operationId: deleteService
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "204":
          description: Service deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services/{service_id}/source:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    get:
      tags: [GitHub, Services]
      summary: Get a service's GitHub source configuration
      operationId: getServiceSource
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Source configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSourceConfiguration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [GitHub, Services]
      summary: Connect a GitHub repository to a service
      operationId: putServiceSource
      security:
        - SupabaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutServiceSourceRequest"
      responses:
        "200":
          description: Connected source configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSourceConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [GitHub, Services]
      summary: Update a service's GitHub source configuration
      operationId: patchServiceSource
      security:
        - SupabaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchServiceSourceRequest"
      responses:
        "200":
          description: Updated source configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSourceConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [GitHub, Services]
      summary: Disconnect a service's GitHub source
      operationId: disconnectServiceSource
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Source disconnect status.
          content:
            application/json:
              schema:
                type: object
                required: [id, service_id, source_status, disconnect_reason]
                properties:
                  id: { type: string, format: uuid }
                  service_id: { type: string, format: uuid }
                  source_status: { type: string }
                  disconnect_reason: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services/{service_id}/deployments:
    parameters:
      - name: service_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Services
        - Deployments
      summary: Trigger a manual deployment
      description: >-
        Resolves the head commit of `source.ref` (default: the service source's branch) through GitHub and
        queues a deployment and build job. Requires an active service source. Send `Idempotency-Key` to
        make retries safe. The body must be a JSON object (`{}` is fine).
      operationId: createManualDeployment
      security:
        - SupabaseBearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualDeploymentRequest"
      responses:
        "201":
          description: Deployment queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualDeploymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: The GitHub client is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/webhooks/github:
    post:
      tags: [GitHub]
      summary: Receive GitHub App webhook events
      description: Verifies GitHub's webhook signature and queues supported events. Authentication uses the GitHub signature headers, not a bearer token.
      operationId: receiveGitHubWebhook
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event delivery was recognized as a duplicate.
        "202":
          description: New event was durably accepted for processing.
        "400":
          description: Missing or invalid event headers or payload.
        "401":
          description: Webhook signature is invalid.
        "413":
          description: Payload exceeds the configured maximum size.
        "503":
          description: Database is unavailable.

components:
  securitySchemes:
    SupabaseBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GitHubInstallationId:
      name: installation_id
      in: path
      required: true
      description: Internal installation UUID, not the numeric GitHub installation ID.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default and maximum are endpoint-specific.
      schema:
        type: integer
        minimum: 0
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `next_cursor` from a previous page.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed id, query parameter or body (`BAD_REQUEST`), or failed validation (`VALIDATION_FAILED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Unknown, deleted, or not owned by the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Slug or service name already exists, or the deployment is not in a state that allows the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    GitHubAccount:
      type: object
      required: [login, type]
      properties:
        login: { type: string }
        type: { type: string }
    GitHubInstallationStart:
      type: object
      required: [installation_url, state_expires_at]
      properties:
        installation_url: { type: string, format: uri }
        state_expires_at: { type: string }
    GitHubInstallation:
      type: object
      required: [id, github_installation_id, github_account, status, repository_selection, repository_count, last_synced_at, installed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        github_installation_id: { type: integer, format: int64 }
        github_account: { $ref: "#/components/schemas/GitHubAccount" }
        status: { type: string }
        repository_selection: { type: string }
        repository_count: { type: integer }
        last_synced_at: { type: [string, "null"], format: date-time }
        installed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GitHubInstallationList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/GitHubInstallation" }
        next_cursor: { type: [string, "null"] }
    GitHubInstallationDetail:
      allOf:
        - $ref: "#/components/schemas/GitHubInstallation"
        - type: object
          required: [account_id, permissions, suspended_at, suspended_by_github]
          properties:
            account_id: { type: integer, format: int64 }
            permissions:
              type: object
              additionalProperties: { type: string }
            suspended_at: { type: [string, "null"], format: date-time }
            suspended_by_github: { type: boolean }
    GitHubRepository:
      type: object
      required: [id, github_repository_id, owner, name, full_name, default_branch, private, archived, html_url]
      properties:
        id: { type: string, format: uuid }
        github_repository_id: { type: integer, format: int64 }
        owner: { type: string }
        name: { type: string }
        full_name: { type: string }
        default_branch: { type: string }
        private: { type: boolean }
        archived: { type: boolean }
        html_url: { type: string, format: uri }
    GitHubRepositoryList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/GitHubRepository" }
        next_cursor: { type: [string, "null"] }
    ServiceSourceConfiguration:
      type: object
      required: [id, service_id, repository, branch, root_directory, dockerfile_path, build_configuration, auto_deploy, source_status, last_seen_commit_sha]
      properties:
        id: { type: string, format: uuid }
        service_id: { type: string, format: uuid }
        repository:
          type: object
          required: [id, full_name]
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
        branch: { type: string }
        root_directory: { type: string }
        dockerfile_path: { type: [string, "null"] }
        build_configuration:
          type: object
          additionalProperties: true
        auto_deploy: { type: boolean }
        source_status: { type: string }
        disconnect_reason: { type: [string, "null"] }
        last_seen_commit_sha: { type: [string, "null"] }
        last_deployment_id: { type: [string, "null"], format: uuid }
    PutServiceSourceRequest:
      type: object
      required: [repository_id, branch, root_directory, dockerfile_path, build_configuration]
      properties:
        repository_id: { type: string, format: uuid }
        branch: { type: string }
        root_directory: { type: string }
        dockerfile_path: { type: [string, "null"] }
        build_configuration:
          type: object
          additionalProperties: true
        auto_deploy: { type: boolean, default: true }
    PatchServiceSourceRequest:
      type: object
      properties:
        branch: { type: string }
        root_directory: { type: string }
        dockerfile_path: { type: [string, "null"] }
        build_configuration:
          type: object
          additionalProperties: true
        auto_deploy: { type: boolean }
    CreateEnvironmentRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
    Environment:
      type: object
      required: [id, name, type, is_ephemeral]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        is_ephemeral: { type: boolean }
    HealthResponse:
      type: object
      description: Service health status and routing telemetry.
      required:
        - status
        - service
        - version
        - region
        - edge_routing
        - uptime_seconds
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          example: healthy
        service:
          type: string
          example: meridian-api
        version:
          type: string
          example: 1.0.0
        region:
          type: string
          example: cdg-1 (Paris)
        edge_routing:
          type: string
          example: anycast
        uptime_seconds:
          type: integer
          minimum: 0
          example: 4120
        timestamp:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              description: Machine-readable code.
              enum:
                - BAD_REQUEST
                - VALIDATION_FAILED
                - UNAUTHORIZED
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
              example: NOT_FOUND
            message:
              type: string
              example: resource not found
            request_id:
              type: string
              example: 0b1f6c0e-6c1d-4a35-8d8e-2f0f6f5c9a11

    DeploymentStatus:
      type: string
      description: >-
        Lifecycle: queued -> building -> image_ready -> deploying -> health_checking -> running.
        Terminal: failed, cancelled, superseded. `pending` and `active` are legacy values.
      enum:
        - queued
        - building
        - image_ready
        - deploying
        - health_checking
        - running
        - superseded
        - failed
        - cancelled
        - pending
        - active

    DeploymentSummary:
      type: object
      required:
        - id
        - project_id
        - environment_id
        - service_id
        - status
        - commit_sha
        - branch
        - trigger_type
        - error_message
        - status_reason
        - image_ref
        - public_url
        - cancel_requested_at
        - created_at
        - started_at
        - finished_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        service_id:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        commit_sha:
          type: string
        branch:
          type: string
        trigger_type:
          type: string
          description: How the deployment was triggered.
          examples: [manual, github_push]
        error_message:
          type: [string, "null"]
        status_reason:
          type: [string, "null"]
        image_ref:
          type: [string, "null"]
          description: "`<repository>@sha256:<digest>` once the image is built."
        public_url:
          type: [string, "null"]
        cancel_requested_at:
          type: [string, "null"]
          format: date-time
          description: Set once a cancel was requested; status changes when the orchestrator acts on it.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time

    BuildSummary:
      type: object
      required:
        - id
        - status
        - current_stage
        - image_repository
        - image_tag
        - image_digest
        - error_message
        - requested_at
        - started_at
        - completed_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, dispatched, running, succeeded, failed, cancelled]
        current_stage:
          type: [string, "null"]
        image_repository:
          type: [string, "null"]
        image_tag:
          type: [string, "null"]
        image_digest:
          type: [string, "null"]
          description: "`sha256:<64 hex>`"
        error_message:
          type: [string, "null"]
        requested_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    DeploymentEvent:
      type: object
      required:
        - from_status
        - to_status
        - reason
        - created_at
      properties:
        from_status:
          oneOf:
            - $ref: "#/components/schemas/DeploymentStatus"
            - type: "null"
          description: "`null` for the creation event."
        to_status:
          $ref: "#/components/schemas/DeploymentStatus"
        reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    DeploymentDetail:
      allOf:
        - $ref: "#/components/schemas/DeploymentSummary"
        - type: object
          required:
            - build
            - events
          properties:
            build:
              oneOf:
                - $ref: "#/components/schemas/BuildSummary"
                - type: "null"
            events:
              type: array
              description: Status transitions, oldest first.
              items:
                $ref: "#/components/schemas/DeploymentEvent"

    DeploymentList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentSummary"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; `null` on the last page.

    ServiceSource:
      type: object
      description: GitHub source of a service.
      required:
        - repository_full_name
        - branch
        - root_directory
        - source_status
        - auto_deploy
      properties:
        repository_full_name:
          type: string
          example: octo/shop
        branch:
          type: string
        root_directory:
          type: string
          example: .
        source_status:
          type: string
          enum: [active, disconnected, blocked]
        auto_deploy:
          type: boolean

    ServiceSummary:
      type: object
      required:
        - id
        - project_id
        - environment_id
        - environment_name
        - name
        - type
        - source
        - latest_deployment
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        environment_name:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [web, worker, cron]
        source:
          oneOf:
            - $ref: "#/components/schemas/ServiceSource"
            - type: "null"
        latest_deployment:
          oneOf:
            - $ref: "#/components/schemas/DeploymentSummary"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectSummary:
      type: object
      required:
        - id
        - slug
        - name
        - git_repository_url
        - default_branch
        - services_count
        - latest_deployment
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        git_repository_url:
          type: [string, "null"]
        default_branch:
          type: string
          example: main
        services_count:
          type: integer
          minimum: 0
        latest_deployment:
          oneOf:
            - $ref: "#/components/schemas/DeploymentSummary"
            - type: "null"
          description: Most recent deployment across all services of the project.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EnvironmentSummary:
      type: object
      required:
        - id
        - name
        - type
        - is_ephemeral
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: production
        type:
          type: string
          enum: [production, staging, preview]
        is_ephemeral:
          type: boolean

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          required:
            - environments
            - services
          properties:
            environments:
              type: array
              items:
                $ref: "#/components/schemas/EnvironmentSummary"
            services:
              type: array
              items:
                $ref: "#/components/schemas/ServiceSummary"

    ProjectList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        next_cursor:
          type: [string, "null"]

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          description: DNS-label slug (1-63 chars of `a-z`, `0-9`, `-`). Derived from `name` when omitted.
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    CreateServiceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        type:
          type: string
          enum: [web, worker]
          default: web
        environment_id:
          type: [string, "null"]
          format: uuid
          description: Defaults to the project's production environment.

    LogLine:
      type: object
      required:
        - id
        - timestamp
        - stream
        - level
        - stage
        - message
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        stream:
          type: string
          enum: [stdout, stderr, system]
        level:
          type: string
          enum: [debug, info, warn, error]
        stage:
          type: [string, "null"]
        message:
          type: string

    LogList:
      type: object
      required:
        - data
        - next_after
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"
        next_after:
          type: [integer, "null"]
          format: int64
          description: Id of the last returned line (use as `after`); `null` when `data` is empty.

    FlatService:
      type: object
      required:
        - id
        - name
        - type
        - project_id
        - project_name
        - environment_id
        - environment_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        environment_id:
          type: string
          format: uuid
        environment_name:
          type: string

    FlatServiceList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FlatService"

    ManualDeploymentRequest:
      type: object
      additionalProperties: false
      properties:
        source:
          type: object
          additionalProperties: false
          properties:
            ref:
              type: string
              description: Branch or `refs/heads/<branch>`; defaults to the service source's branch.
        reason:
          type: string

    ManualDeploymentResponse:
      type: object
      required:
        - id
        - service_id
        - status
        - commit_sha
        - build_job_id
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        commit_sha:
          type: string
        build_job_id:
          type: string
          format: uuid
