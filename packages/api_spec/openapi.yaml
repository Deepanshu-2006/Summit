        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummaryResponse"
        next_cursor:
          type: [string, "null"]

    AgentRevision:
      type: object
      required:
        - id
        - agent_id
        - revision_number
        - config
        - config_hash
        - created_at
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        revision_number:
          type: integer
        config:
          $ref: "#/components/schemas/AgentConfig"
        config_hash:
          type: string
        created_at:
          type: string
          format: date-time

    RevisionListResponse:
