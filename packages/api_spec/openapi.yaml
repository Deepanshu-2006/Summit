openapi: 3.1.0
info:
  title: Summit Jetway PaaS Control Plane API
  version: 1.1.0
  description: >-
    OpenAPI 3.1 contract for the Summit Jetway developer platform, matching what the Go
    backend (apps/backend) serves. Paths are the Go paths: the Next.js dashboard reaches
    them through its server-side proxy, which forwards `/api/platform/v1/*` to `/v1/*`
    with the caller's Supabase access token as a Bearer token.


    All `/v1` routes require `Authorization: Bearer <Supabase access token>` and are
    tenant-scoped to the authenticated user. A resource owned by another user is
    indistinguishable from a missing one and yields `404`.


    JSON fields are snake_case, timestamps are RFC 3339 (UTC), and nullable fields are
    serialised as JSON `null`. Errors use the envelope described by `ErrorEnvelope`.
servers:
  - url: http://localhost:4000
    description: Local Backend Service
  - url: https://api.jetway.internal
    description: Internal Kubernetes Control Plane

tags:
  - name: System
    description: Service heartbeat
  - name: Authentication
    description: Authenticated user profile synchronization
  - name: Projects
    description: Projects, their environments and services
  - name: Services
    description: Deployable services and manual deploys
  - name: Deployments
    description: Deployment history, status, cancellation and build logs
  - name: Managed Agents
    description: Agent definitions and immutable revisions
  - name: Agent Deployments
    description: Environment-specific agent deployments
  - name: Agent Sessions
    description: Independent agent conversation sessions

paths:
  /v1/auth/profile:
    post:
      tags:
        - Authentication
      summary: Sync authenticated user profile
      description: Validates a Supabase access token and upserts the matching public.users profile.
      operationId: syncAuthenticatedUserProfile
      security:
        - SupabaseBearerAuth: []
      responses:
        "204":
          description: The authenticated user's profile was created or updated.
        "401":
          description: The access token is missing or invalid.
        "500":
          description: The profile could not be persisted.
        "503":
          description: Authentication or profile storage is unavailable.

  /api/v1/health:
    get:
      tags:
        - System
      summary: System Health & Heartbeat
      description: Returns service health, uptime, and edge routing region. Also served at `/health`.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy and routing traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/projects:
    get:
      tags:
        - Projects
      summary: List projects
      description: The caller's projects, newest first, with service counts and the latest deployment.
      operationId: listProjects
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Projects
      summary: Create a project
      description: >-
        Creates a project together with its `production` environment. When `slug` is omitted it is
        derived from `name` (lowercase, runs of non `[a-z0-9]` become `-`, trimmed, at most 63
        characters, `project` if empty); a collision on a derived slug is retried as `-2`, `-3`, ...
        (bounded), whereas a collision on an explicit `slug` returns `409`.
      operationId: createProject
      security:
        - SupabaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Projects
      summary: Get a project
      description: Project with its environments and services (each with source and latest deployment).
      operationId: getProject
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Projects
      summary: Update a project
      operationId: updateProject
      security:
        - SupabaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Projects
      summary: Delete a project
      description: Soft-deletes the project and its environments and services. The slug stays reserved.
      operationId: deleteProject
      security:
        - SupabaseBearerAuth: []
      responses:
        "204":
          description: Project deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/projects/{project_id}/services:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags:
        - Projects
        - Services
      summary: Create a service
      description: >-
        Creates a `web` or `worker` service in the project's production environment, or in
        `environment_id` if given (it must belong to this project, otherwise `404`). The service name must
        be 1-63 chars of `a-z`, `0-9`, `-`, not starting or ending with `-`, and unique per environment.
      operationId: createProjectService
      security:
        - SupabaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/projects/{project_id}/deployments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags:
        - Deployments
      summary: List a project's deployments
      description: Newest first, keyset-paginated.
      operationId: listProjectDeployments
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of deployments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/deployments/{deployment_id}:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags:
        - Deployments
      summary: Get a deployment
      description: Deployment with its build job and status transition history (oldest first).
      operationId: getDeployment
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Deployment detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/deployments/{deployment_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    post:
      tags:
        - Deployments
      summary: Request cancellation of a deployment
      description: >-
        Records a cancel request on an in-flight deployment (queued, building, image_ready, deploying,
        health_checking). The orchestrator performs the actual transition asynchronously, so the returned
        `status` may still be the in-flight one while `cancel_requested_at` is set. Repeating the call is
        idempotent. Running or terminal deployments yield `409`.
      operationId: cancelDeployment
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Cancel request recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/deployments/{deployment_id}/logs:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags:
        - Deployments
      summary: Read build logs
      description: >-
        Build log lines with `id > after`, in insertion order. To tail, pass the previous response's
        `next_after` as `after`; `next_after` is the id of the last returned line and `null` when the page
        is empty. `limit` defaults to 500 and is capped at 1000.
      operationId: listDeploymentLogs
      security:
        - SupabaseBearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          description: Return only lines with an id greater than this value (default 0).
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000
      responses:
        "200":
          description: Log lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services:
    get:
      tags:
        - Services
      summary: List deployable services
      description: The caller's web and worker services across all projects, for source selection.
      operationId: listServices
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlatServiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/services/{service_id}/deployments:
    parameters:
      - name: service_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Services
        - Deployments
      summary: Trigger a manual deployment
      description: >-
        Resolves the head commit of `source.ref` (default: the service source's branch) through GitHub and
        queues a deployment and build job. Requires an active service source. Send `Idempotency-Key` to
        make retries safe. The body must be a JSON object (`{}` is fine).
      operationId: createManualDeployment
      security:
        - SupabaseBearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualDeploymentRequest"
      responses:
        "201":
          description: Deployment queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualDeploymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: The GitHub client is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/projects/{slug}/agents:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    post:
      tags:
        - Managed Agents
      summary: Create an agent definition
      description: >-
        Atomically creates a project-scoped agent definition and its initial immutable revision.
        Requires an `Idempotency-Key` header. A replay with the same request hash returns the existing
        resource; a different request hash returns `409 Conflict`.
      operationId: createAgent
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent created with initial revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailResponse"
        "200":
          description: Existing agent returned for idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags:
        - Managed Agents
      summary: List project agents
      description: Lists caller's agent definitions for the project, newest first.
      operationId: listAgents
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of agent definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags:
        - Managed Agents
      summary: Get agent definition
      description: Returns agent definition, its current revision, and active deployment summary.
      operationId: getAgent
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Agent detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{agent_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags:
        - Managed Agents
      summary: List agent revisions
      description: Returns immutable revisions for an agent, newest first.
      operationId: listAgentRevisions
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Revisions list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Managed Agents
      summary: Create an immutable revision
      description: >-
        Creates a new immutable revision for the agent definition. Requires `Idempotency-Key`.
        Replay with the same hash returns the existing revision; a different hash returns `409 Conflict`.
      operationId: createAgentRevision
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRevisionRequest"
      responses:
        "201":
          description: Revision created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRevision"
        "200":
          description: Existing revision returned for idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agents/{agent_id}/deployments:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      tags:
        - Agent Deployments
      summary: Create an agent deployment
      description: >-
        Creates an agent deployment pinned to an immutable revision and environment, and transactionally
        enqueues an `agent.deployment.provision.requested` outbox event.
      operationId: createAgentDeployment
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentRequest"
      responses:
        "202":
          description: Deployment provisioning enqueued.
          headers:
            Location:
              description: URL of the newly created deployment.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeployment"
        "200":
          description: Existing deployment returned for idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags:
        - Agent Deployments
      summary: List deployments for an agent
      operationId: listAgentDeployments
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Deployments owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent-deployments/{deployment_id}:
    parameters:
      - $ref: "#/components/parameters/AgentDeploymentId"
    get:
      tags:
        - Agent Deployments
      summary: Get agent deployment
      description: Returns persisted deployment lifecycle state and runtime metadata.
      operationId: getAgentDeployment
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Deployment metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent-deployments/{deployment_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/AgentDeploymentId"
    get:
      tags:
        - Agent Sessions
      summary: List deployment sessions
      description: Returns sessions owned by the deployment.
      operationId: listAgentSessions
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: List of sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Agent Sessions
      summary: Create an agent session
      description: >-
        Creates an independent conversation session within the deployment and transactionally enqueues
        an `agent.session.ensure.requested` outbox record.
      operationId: createAgentSession
      security:
        - SupabaseBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "202":
          description: Session provisioning enqueued.
          headers:
            Location:
              description: URL of the newly created session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "200":
          description: Existing session returned for idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agent-sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    get:
      tags:
        - Agent Sessions
      summary: Get agent session
      description: Returns session metadata after user ownership verification.
      operationId: getAgentSession
      security:
        - SupabaseBearerAuth: []
      responses:
        "200":
          description: Session metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    SupabaseBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 20, capped at 100.
      schema:
        type: integer
        minimum: 0
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `next_cursor` from a previous page.
      schema:
        type: string
    ProjectSlug:
      name: slug
      in: path
      required: true
      description: Project slug or UUID
      schema:
        type: string
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentDeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentSessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Idempotency key ensuring at-most-once processing
      schema:
        type: string
        maxLength: 128

  responses:
    BadRequest:
      description: Malformed id, query parameter or body (`BAD_REQUEST`), or failed validation (`VALIDATION_FAILED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Unknown, deleted, or not owned by the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Slug or service name already exists, or the deployment is not in a state that allows the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    HealthResponse:
      type: object
      description: Service health status and routing telemetry.
      required:
        - status
        - service
        - version
        - region
        - edge_routing
        - uptime_seconds
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          example: healthy
        service:
          type: string
          example: meridian-api
        version:
          type: string
          example: 1.0.0
        region:
          type: string
          example: cdg-1 (Paris)
        edge_routing:
          type: string
          example: anycast
        uptime_seconds:
          type: integer
          minimum: 0
          example: 4120
        timestamp:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              description: Machine-readable code.
              enum:
                - BAD_REQUEST
                - VALIDATION_FAILED
                - UNAUTHORIZED
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
              example: NOT_FOUND
            message:
              type: string
              example: resource not found
            request_id:
              type: string
              example: 0b1f6c0e-6c1d-4a35-8d8e-2f0f6f5c9a11

    DeploymentStatus:
      type: string
      description: >-
        Lifecycle: queued -> building -> image_ready -> deploying -> health_checking -> running.
        Terminal: failed, cancelled, superseded. `pending` and `active` are legacy values.
      enum:
        - queued
        - building
        - image_ready
        - deploying
        - health_checking
        - running
        - superseded
        - failed
        - cancelled
        - pending
        - active

    DeploymentSummary:
      type: object
      required:
        - id
        - project_id
        - environment_id
        - service_id
        - status
        - commit_sha
        - branch
        - trigger_type
        - error_message
        - status_reason
        - image_ref
        - public_url
        - cancel_requested_at
        - created_at
        - started_at
        - finished_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        service_id:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        commit_sha:
          type: string
        branch:
          type: string
        trigger_type:
          type: string
          description: How the deployment was triggered.
          examples: [manual, github_push]
        error_message:
          type: [string, "null"]
        status_reason:
          type: [string, "null"]
        image_ref:
          type: [string, "null"]
          description: "`<repository>@sha256:<digest>` once the image is built."
        public_url:
          type: [string, "null"]
        cancel_requested_at:
          type: [string, "null"]
          format: date-time
          description: Set once a cancel was requested; status changes when the orchestrator acts on it.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time

    BuildSummary:
      type: object
      required:
        - id
        - status
        - current_stage
        - image_repository
        - image_tag
        - image_digest
        - error_message
        - requested_at
        - started_at
        - completed_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, dispatched, running, succeeded, failed, cancelled]
        current_stage:
          type: [string, "null"]
        image_repository:
          type: [string, "null"]
        image_tag:
          type: [string, "null"]
        image_digest:
          type: [string, "null"]
          description: "`sha256:<64 hex>`"
        error_message:
          type: [string, "null"]
        requested_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    DeploymentEvent:
      type: object
      required:
        - from_status
        - to_status
        - reason
        - created_at
      properties:
        from_status:
          oneOf:
            - $ref: "#/components/schemas/DeploymentStatus"
            - type: "null"
          description: "`null` for the creation event."
        to_status:
          $ref: "#/components/schemas/DeploymentStatus"
        reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    DeploymentDetail:
      allOf:
        - $ref: "#/components/schemas/DeploymentSummary"
        - type: object
          required:
            - build
            - events
          properties:
            build:
              oneOf:
                - $ref: "#/components/schemas/BuildSummary"
                - type: "null"
            events:
              type: array
              description: Status transitions, oldest first.
              items:
                $ref: "#/components/schemas/DeploymentEvent"

    DeploymentList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentSummary"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; `null` on the last page.

    ServiceSource:
      type: object
      description: GitHub source of a service.
      required:
        - repository_full_name
        - branch
        - root_directory
        - source_status
        - auto_deploy
      properties:
        repository_full_name:
          type: string
          example: octo/shop
        branch:
          type: string
        root_directory:
          type: string
          example: .
        source_status:
          type: string
          enum: [active, disconnected, blocked]
        auto_deploy:
          type: boolean

    ServiceSummary:
      type: object
      required:
        - id
        - project_id
        - environment_id
        - environment_name
        - name
        - type
        - source
        - latest_deployment
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        environment_name:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [web, worker, cron]
        source:
          oneOf:
            - $ref: "#/components/schemas/ServiceSource"
            - type: "null"
        latest_deployment:
          oneOf:
            - $ref: "#/components/schemas/DeploymentSummary"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectSummary:
      type: object
      required:
        - id
        - slug
        - name
        - git_repository_url
        - default_branch
        - services_count
        - latest_deployment
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        git_repository_url:
          type: [string, "null"]
        default_branch:
          type: string
          example: main
        services_count:
          type: integer
          minimum: 0
        latest_deployment:
          oneOf:
            - $ref: "#/components/schemas/DeploymentSummary"
            - type: "null"
          description: Most recent deployment across all services of the project.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EnvironmentSummary:
      type: object
      required:
        - id
        - name
        - type
        - is_ephemeral
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: production
        type:
          type: string
          enum: [production, staging, preview]
        is_ephemeral:
          type: boolean

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          required:
            - environments
            - services
          properties:
            environments:
              type: array
              items:
                $ref: "#/components/schemas/EnvironmentSummary"
            services:
              type: array
              items:
                $ref: "#/components/schemas/ServiceSummary"

    ProjectList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        next_cursor:
          type: [string, "null"]

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          description: DNS-label slug (1-63 chars of `a-z`, `0-9`, `-`). Derived from `name` when omitted.
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    CreateServiceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        type:
          type: string
          enum: [web, worker]
          default: web
        environment_id:
          type: [string, "null"]
          format: uuid
          description: Defaults to the project's production environment.

    LogLine:
      type: object
      required:
        - id
        - timestamp
        - stream
        - level
        - stage
        - message
      properties:
        id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        stream:
          type: string
          enum: [stdout, stderr, system]
        level:
          type: string
          enum: [debug, info, warn, error]
        stage:
          type: [string, "null"]
        message:
          type: string

    LogList:
      type: object
      required:
        - data
        - next_after
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"
        next_after:
          type: [integer, "null"]
          format: int64
          description: Id of the last returned line (use as `after`); `null` when `data` is empty.

    FlatService:
      type: object
      required:
        - id
        - name
        - type
        - project_id
        - project_name
        - environment_id
        - environment_name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        environment_id:
          type: string
          format: uuid
        environment_name:
          type: string

    FlatServiceList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FlatService"

    ManualDeploymentRequest:
      type: object
      additionalProperties: false
      properties:
        source:
          type: object
          additionalProperties: false
          properties:
            ref:
              type: string
              description: Branch or `refs/heads/<branch>`; defaults to the service source's branch.
        reason:
          type: string

    ManualDeploymentResponse:
      type: object
      required:
        - id
        - service_id
        - status
        - commit_sha
        - build_job_id
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        commit_sha:
          type: string
        build_job_id:
          type: string
          format: uuid

    AgentDeploymentStatus:
      type: string
      enum:
        - provisioning
        - active
        - draining
        - read_only
        - failed
        - terminated

    AgentSessionStatus:
      type: string
      enum:
        - provisioning
        - active
        - read_only
        - purge_pending
        - purged
        - failed

    CredentialRefSummary:
      type: object
      required:
        - name
        - secret_reference_id
      properties:
        name:
          type: string
        secret_reference_id:
          type: string
          format: uuid
        purpose:
          type: string

    AgentConfig:
      type: object
      required:
        - model
        - instructions
      properties:
        model:
          type: string
        instructions:
          type: string
        tools:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        credential_references:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRefSummary"

    CreateAgentRequest:
      type: object
      required:
        - name
        - model
        - instructions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        model:
          type: string
        instructions:
          type: string
        tools:
          type: array
          items:
            type: string
        limits:
          type: object
        credential_references:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRefSummary"

    CreateRevisionRequest:
      type: object
      required:
        - model
        - instructions
      properties:
        model:
          type: string
        instructions:
          type: string
        tools:
          type: array
          items:
            type: string
        limits:
          type: object
        credential_references:
          type: array
          items:
            $ref: "#/components/schemas/CredentialRefSummary"

    CreateDeploymentRequest:
      type: object
      required:
        - environment_id
        - agent_revision_id
      properties:
        environment_id:
          type: string
          format: uuid
        agent_revision_id:
          type: string
          format: uuid
        runtime_version:
          type: string
          default: v1

    CreateSessionRequest:
      type: object
      description: Runtime conversation identity is assigned by Summit's agent runtime.

    AgentResponse:
      type: object
      required:
        - id
        - project_id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        current_revision_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentSummaryResponse:
      type: object
      required:
        - id
        - project_id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        current_revision_id:
          type: [string, "null"]
          format: uuid
        current_revision_number:
          type: [integer, "null"]
        active_deployment_id:
          type: [string, "null"]
          format: uuid
        active_deployment_status:
