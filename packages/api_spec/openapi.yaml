          format: uuid
        deployment_id:
          type: string
          format: uuid
        pi_conversation_id:
          type: [string, "null"]
        actor_key_version:
          type: string
        status:
          $ref: "#/components/schemas/AgentSessionStatus"
        status_reason:
          type: [string, "null"]
        last_activity_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentSession"

    AgentDetailResponse:
      type: object
      required:
        - id
        - project_id
        - name
        - created_at
        - updated_at
      properties:
        id:
