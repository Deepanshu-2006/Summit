        - environment_id
        - deployment_number
        - runtime_version
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        agent_revision_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        deployment_number:
          type: integer
        supersedes_deployment_id:
          type: [string, "null"]
          format: uuid
        runtime_version:
          type: string
        status:
          $ref: "#/components/schemas/AgentDeploymentStatus"
        status_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeploymentListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentDeployment"

    AgentSession:
