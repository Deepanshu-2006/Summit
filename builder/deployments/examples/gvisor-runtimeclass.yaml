# Variant of builder/gvisor/runtimeclass.yaml for a DEDICATED sandbox node pool: it adds pod
# overhead accounting and pins builder pods to labelled/tainted nodes. For the MVP Kind/test
# cluster use builder/gvisor/runtimeclass.yaml (no scheduling constraints) instead.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/name: summit-runtime
    app.kubernetes.io/component: sandbox
handler: runsc
overhead:
  podFixed:
    cpu: "250m"
    memory: "256Mi"
scheduling:
  nodeSelector:
    summit.io/node-role: builder-sandbox
  tolerations:
    - key: "summit.io/sandbox-workload"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
